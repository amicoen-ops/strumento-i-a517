name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dipendenze
        run: npm ci --no-audit --no-fund

      - name: Pagine dentro l'app
        run: npx cap sync android

      - name: Compila (firmato con keystore/strumento.keystore)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build.log

      - name: Registro dell'errore (in una issue, per poterlo leggere da fuori)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -n -E "error:|ERROR|What went wrong|FAILURE|e: |warning: \[" build.log | head -60; echo '---'; tail -80 build.log; echo '```'; } > errore.md || true
          gh issue create -R ${{ github.repository }} --title "Compilazione ${{ github.run_number }} fallita" --body-file errore.md || true

      - name: Nome del file
        run: cp android/app/build/outputs/apk/release/app-release.apk I-A517-Strumento-1.0.${{ github.run_number }}.apk

      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: I-A517 Strumento 1.0.${{ github.run_number }}
          body: Scarica il file .apk dal telefono e installalo (sopra la versione precedente, i dati restano).
          files: I-A517-Strumento-1.0.${{ github.run_number }}.apk
