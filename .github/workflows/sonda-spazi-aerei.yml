name: Sonda fonti spazi aerei

on:
  push:
    branches: [sonda]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Prova gli indirizzi
        run: |
          {
          for u in https://storage.openaip.net/openaip-system-exports/it_asp_v2.txt https://storage.openaip.net/openaip-system-exports/it_asp.txt https://storage.openaip.net/openaip-system-exports/it_apt.cupx; do
            echo "=== $u"
            curl -sS -L -o "$(basename $u)" -D head.txt -w "codice %{http_code} · %{size_download} byte · %{content_type}\n" --max-time 60 "$u" || echo "errore curl"
            grep -i -E "^(content-type|access-control|last-modified|cache-control):" head.txt
          done
          echo "=== intestazioni CORS con Origin"
          curl -sS -o /dev/null -D - -H "Origin: https://localhost" https://storage.openaip.net/openaip-system-exports/it_asp_v2.txt | grep -i -E "access-control|^HTTP"
          echo "=== prime righe"; head -40 it_asp_v2.txt
          echo "=== tipi AC"; grep -E "^AC " it_asp_v2.txt | sort | uniq -c | sort -rn | head -30
          echo "=== chiavi usate"; cut -c1-2 it_asp_v2.txt | sort | uniq -c | sort -rn | head -20
          } > sonda.txt 2>&1
          cat sonda.txt
      - name: Copia del file nella pre-release diagnostica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload diagnostica -R ${{ github.repository }} --clobber it_asp_v2.txt || true
      - name: Risultato in una issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; head -c 60000 sonda.txt; echo '```'; } > corpo.md
          gh issue create -R ${{ github.repository }} --title "Sonda spazi aerei" --body-file corpo.md
