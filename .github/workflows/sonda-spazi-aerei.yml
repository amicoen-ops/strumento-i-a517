name: Sonda fonti spazi aerei

on:
  push:
    branches: [sonda]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Prova gli indirizzi
        run: |
          B=https://storage.googleapis.com/29f98e10-a489-4c82-ae5e-489dbcd4912f
          {
          for u in \
            "$B/it_asp.txt" "$B/it_asp.openair" "$B/it_asp_txt" "$B/it_asp.geojson" "$B/it_asp.json" \
            "$B?prefix=it_" "$B/?prefix=it_asp" \
            "https://storage.googleapis.com/storage/v1/b/29f98e10-a489-4c82-ae5e-489dbcd4912f/o?prefix=it_" \
            "https://api.core.openaip.net/api/airspaces?country=IT&limit=1" \
            "https://download.xcsoar.org/repository" \
            "https://snapshots.openflightmaps.org/live/" \
            "https://www.openaip.net/data/exports" ; do
            echo "=== $u"
            curl -sS -L -A "Mozilla/5.0" -o body.bin -D head.txt -w "codice %{http_code} · %{size_download} byte · %{content_type}\n" --max-time 40 "$u" || echo "errore curl"
            grep -i -E "^(location|content-type|x-goog|www-authenticate):" head.txt | head -5
            head -c 700 body.bin | tr -d '\000' ; echo
          done
          echo "=== righe con openaip nel repository di XCSoar"
          curl -sS --max-time 40 https://download.xcsoar.org/repository | grep -i -B3 -A6 -E "ital|openaip|_asp" | head -80
          } > sonda.txt 2>&1
          cat sonda.txt
      - name: Risultato in una issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; head -c 60000 sonda.txt; echo '```'; } > corpo.md
          gh issue create -R ${{ github.repository }} --title "Sonda spazi aerei" --body-file corpo.md
